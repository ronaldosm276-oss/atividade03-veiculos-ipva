<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJETO CÁLCULO - SEGURO E IPVA AUTOMOTIVO</title>
    <link rel="stylesheet" href="">
    <script src="js/script_veiculo.js" type="module" defer></script>
</head>

<body>
    <h3>OBJETIVO:</h3>
    <div id="geral">
        <div id="form">
            <form id="form">
                <label for="modelo">Modelo</label>
                <input type="text" name="modelo" id="modelo" required>
                <br>
                <label for="marca">Marca</label>
                <input type="text" name="marca" id="marca" required>
                <br>
                <label for="placa">Placa</label>
                <input type="text" name="placa" id="placa" required>
                <br>
                <label for="ano">Ano de Fabricação</label>
                <input type="number" name="ano" id="ano" required>
                <br>
                <label for="valor">Valor de Mercado do Veículo</label>
                <input type="number" name="valor" id="valor" required>
                
                <br>
                <br>
                <h5>Tipo de combustível</h5>

                <input type="radio" id="gasolina" name="typecomb" value="gasolina" required>
                <label for="gasolina">GASOLINA</label>

                <input type="radio" id="etanol" 
                name="typecomb" value="etanol" required>
                <label for="etanol">ETANOL</label>
            
                <input type="radio" id="bio" name="typecomb" value="bio" required>
                <label for="bio">BIO-COMBUSTÍVEL</label>

                <input type="radio" id="hibrido" name="typecomb" value="hibrido" required>
                <label for="hibrido">HIBRÍDO</label>

                <input type="radio" id="eletrico" name="typecomb" value="eletrico" required>
                <label for="eletrico">ELÉTRICO</label>

                <br><br>
                <button type="submit" id="submit">Adicionar</button>

                <button type="reset">Limpar</button>



            </form>

            <div id="div-adicionar">
                Cada item deve mostrar:
                 Modelo;
                 Marca;
                 Placa;
                 Idade do veículo;
                Valor Seguro a pagar;
        </div>


    </div>
</body>

</html>
